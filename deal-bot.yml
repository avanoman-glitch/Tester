name: Pet Deal Alert Bot

on:
  schedule:
    - cron: "5 * * * *"    # runs 5 minutes past every hour
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed so the bot can publish the updated deals page

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python deal_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
      - name: Publish updated deals page
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update deals page"
          git push
